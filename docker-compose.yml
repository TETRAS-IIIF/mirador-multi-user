services:

  db:
    # Major version pinned: a new server gets the same MariaDB as the others.
    # Never lower it: MariaDB cannot open data written by a newer version.
    image: mariadb:13
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASS}
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASS}
      # Upgrades the system tables when the data comes from an older version.
      MARIADB_AUTO_UPGRADE: "1"
    restart: unless-stopped
    volumes:
      - ./mariaDB/data:/var/lib/mysql:rw
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - app-network

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: ${HTTP_PROTOCOL}://${BACKEND_HOST}
        VITE_CADDY_URL: ${CADDY_HTTP_PROTOCOL}://${CADDY_HOST}
        VITE_INSTANCE_SHORT_NAME: ${INSTANCE_SHORT_NAME}
        VITE_INSTANCE_NAME: ${INSTANCE_NAME}
        VITE_MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE}
        VITE_OIDC_ISSUER: ${OIDC_ISSUER}
        VITE_OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
        VITE_OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI}
        VITE_EXTERNAL_DASHBOARD_URL: ${EXTERNAL_DASHBOARD_URL}
        VITE_ACCOUNT_MANAGEMENT_URL: ${ACCOUNT_MANAGEMENT_URL}
        VITE_ASSISTANT_URL: ${ASSISTANT_URL:-}
    environment:
      VITE_BACKEND_URL: ${HTTP_PROTOCOL}://${BACKEND_HOST}
      VITE_CADDY_URL: ${CADDY_HTTP_PROTOCOL}://${CADDY_HOST}
      INSTANCE_SHORT_NAME: ${INSTANCE_SHORT_NAME}
      INSTANCE_NAME: ${INSTANCE_NAME}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE}
      VITE_OIDC_ISSUER: ${OIDC_ISSUER}
      VITE_OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      VITE_OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI}
      VITE_EXTERNAL_DASHBOARD_URL: ${EXTERNAL_DASHBOARD_URL}
      VITE_ACCOUNT_MANAGEMENT_URL: ${ACCOUNT_MANAGEMENT_URL}
      VITE_ASSISTANT_URL: ${ASSISTANT_URL:-}
    restart: ${RESTART}
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      # The image builds nothing at startup in production, but the dev
      # server (dev.yml) needs time for its first compilation.
      start_period: 120s
    networks:
      - app-network

  backend:
    build: ./backend
    volumes:
      - ./$HTTP_FOLDER:/upload
      - ./logs:/logs
    environment:
      ADMIN_MAIL: ${ADMIN_MAIL}
      ALLOW_CREATE_USER: ${ALLOW_CREATE_USER}
      ALLOW_PEERTUBE_MEDIA: ${ALLOW_PEERTUBE_MEDIA}
      ALLOW_YOUTUBE_MEDIA: ${ALLOW_YOUTUBE_MEDIA}
      BACKEND_PORT: ${BACKEND_PORT}
      BACKEND_URL: ${HTTP_PROTOCOL}://${BACKEND_HOST}
      CADDY_URL: "${CADDY_HTTP_PROTOCOL}://${CADDY_HOST}"
      CLASSIC_AUTHENTICATION: ${CLASSIC_AUTHENTICATION}
      DB_DATABASE: ${DB_DATABASE}
      DB_HOST: ${DB_HOST}
      DB_MIGRATIONS_RUN: ${DB_MIGRATIONS_RUN:-true}
      DB_PASS: ${DB_PASS}
      DB_USER: ${DB_USER}
      FROM_MAIL: ${FROM_MAIL}
      FRONTEND_URL: "${HTTP_PROTOCOL}://${HOST}"
      INSTANCE_NAME: ${INSTANCE_NAME}
      INSTANCE_SHORT_NAME: ${INSTANCE_SHORT_NAME}
      JWT_SECRET: ${JWT_SECRET}
      LOG_FOLDER: ${LOG_FOLDER}
      LOG_LEVEL: ${LOG_LEVEL}
      MAX_API_PAYLOAD_SIZE: ${MAX_API_PAYLOAD_SIZE}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE}
      NAME_MAIL: ${NAME_MAIL}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI}
      OPENID_CONNECTION: ${OPENID_CONNECTION}
      SALT: ${SALT}
      SESSION_SECRET: ${SESSION_SECRET}
      SMTP_DOMAIN: ${SMTP_DOMAIN}
      SMTP_IGNORE_TLS: ${SMTP_IGNORE_TLS}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SSL: ${SMTP_SSL}
      SMTP_USER: ${SMTP_USER}
      SWAGGER_DESCRIPTION: ${SWAGGER_DESCRIPTION}
      SWAGGER_RELATIVE_PATH: ${SWAGGER_RELATIVE_PATH}
      SWAGGER_TITLE: ${SWAGGER_TITLE}
      SWAGGER_VERSION: ${SWAGGER_VERSION}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      HOST: ${HOST}
    depends_on:
      # Starts once MariaDB accepts connections, so the first start (which
      # creates the schema) no longer fails.
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${BACKEND_PORT:-3000}/"]
      interval: 15s
      timeout: 5s
      retries: 5
      # `nest start` compiles, then migrations run, before the port opens.
      start_period: 180s
    restart: ${RESTART}
    links:
      - db
    networks:
      - app-network

  caddy:
    hostname: files
    image: caddy:2
    restart: ${RESTART}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/favicon.ico"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      - CORS_ALLOWED_HOSTS
      - WEBPACK_MODE=development
    volumes:
      - $HTTP_FOLDER:/srv
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./caddy/public:/srv/public
    networks:
      - app-network

networks:
  app-network:
    driver: bridge




